    <section class="password-card">
      <h1>Ar dhearmad tú d'fhocal faire?</h1>
      <p class="helper">Cuir isteach do sheoladh ríomhphoist agus cuirfimid nasc chun é a athshocrú.</p>

      <div class="field">
        <label for="resetEmail">Seoladh Ríomhphoist</label>
        <input id="resetEmail" type="email" autocomplete="email" placeholder="ainm@sampla.com">
      </div>

      <div class="actions">
        <button id="sendResetBtn" class="btn btn-primary" type="button">Seol Ríomhphost</button>
        <a class="btn btn-secondary" href="/ga/login/">Fill ar shíniú isteach</a>
      </div>
    </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPU-jsIupu3lsRrknmlv04A3YnBwXeePU",
      authDomain: "lixby0.firebaseapp.com",
      projectId: "lixby0",
      storageBucket: "lixby0.firebasestorage.app",
      messagingSenderId: "1058088945026",
      appId: "1:1058088945026:web:c56eaa9c71f1ca625fbb9b",
      measurementId: "G-689VDV93C2"
    };

    const statusMsg = document.getElementById("statusMsg");
    const resetEmail = document.getElementById("resetEmail");
    const sendResetBtn = document.getElementById("sendResetBtn");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`.trim();
    }

    function isValidEmail(value) {
      return value.includes("@");
    }

    sendResetBtn.addEventListener("click", async () => {
      const email = resetEmail.value.trim();
      if (!isValidEmail(email)) {
        showStatus("Cuir isteach seoladh ríomhphoist bailí.", "error");
        return;
      }

      try {
        sendResetBtn.disabled = true;
        const response = await fetch("https://sendpasswordreset-dtoucjpwkq-uc.a.run.app", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Níorbh fhéidir an ríomhphost a sheoladh");
        }
        showStatus("Chuir muid ríomhphost chugat. Seiceáil do bhosca isteach.", "success");
      } catch (error) {
        showStatus(`Níorbh fhéidir an ríomhphost a sheoladh: ${error.message}`, "error");
      } finally {
        sendResetBtn.disabled = false;
      }
    });
  </script>
