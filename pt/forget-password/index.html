    <section class="password-card">
      <h1>Esqueceu-se da palavra-passe?</h1>
      <p class="helper">Introduza o seu endereço de email e enviaremos um link para a redefinir.</p>

      <div class="field">
        <label for="resetEmail">Endereço de email</label>
        <input id="resetEmail" type="email" autocomplete="email" placeholder="nome@exemplo.com">
      </div>

      <div class="actions">
        <button id="sendResetBtn" class="btn btn-primary" type="button">Enviar email</button>
        <a class="btn btn-secondary" href="/pt/login/">Voltar a iniciar sessão</a>
      </div>
    </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPU-jsIupu3lsRrknmlv04A3YnBwXeePU",
      authDomain: "lixby0.firebaseapp.com",
      projectId: "lixby0",
      storageBucket: "lixby0.firebasestorage.app",
      messagingSenderId: "1058088945026",
      appId: "1:1058088945026:web:c56eaa9c71f1ca625fbb9b",
      measurementId: "G-689VDV93C2"
    };

    const statusMsg = document.getElementById("statusMsg");
    const resetEmail = document.getElementById("resetEmail");
    const sendResetBtn = document.getElementById("sendResetBtn");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`.trim();
    }

    function isValidEmail(value) {
      return value.includes("@");
    }

    sendResetBtn.addEventListener("click", async () => {
      const email = resetEmail.value.trim();
      if (!isValidEmail(email)) {
        showStatus("Introduza um endereço de email válido.", "error");
        return;
      }

      try {
        sendResetBtn.disabled = true;
        const response = await fetch("https://sendpasswordreset-dtoucjpwkq-uc.a.run.app", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Não foi possível enviar o email");
        }
        showStatus("Enviámos um email para si. Verifique a sua caixa de entrada.", "success");
      } catch (error) {
        showStatus(`Não foi possível enviar o email: ${error.message}`, "error");
      } finally {
        sendResetBtn.disabled = false;
      }
    });
  </script>
