  <main class="container twofa-page">
    <div id="statusMsg" class="status-msg"></div>

    <section class="twofa-card">
      <h1>Weryfikacja dwuetapowa</h1>
      <p class="helper">Aktywuj dodatkową warstwę zabezpieczeń dla swojego konta za pomocą SMS.</p>

      <div class="field-grid">
        <div class="field">
          <label for="phoneNumber">Numer telefonu</label>
          <input id="phoneNumber" type="tel" placeholder="+48 600 000 000">
        </div>
        <div class="field">
          <label for="currentPassword">Aktualne hasło</label>
          <input id="currentPassword" type="password" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="smsCode">Kod SMS</label>
          <input id="smsCode" type="text" inputmode="numeric" maxlength="6" placeholder="123456">
        </div>
      </div>

      <div class="recaptcha-wrap">
        <div id="recaptcha-container"></div>
        <p class="inline-note">Musisz rozwiązać reCAPTCHA, aby wysłać SMS.</p>
      </div>

      <div class="actions">
        <button id="sendCodeBtn" class="btn btn-secondary" type="button">Wyślij kod</button>
        <button id="verifyEnrollBtn" class="btn btn-primary" type="button">Zweryfikuj i aktywuj</button>
        <a class="btn btn-secondary" href="/pl/account/">Wróć do mojego konta</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      EmailAuthProvider,
      reauthenticateWithCredential,
      RecaptchaVerifier,
      PhoneAuthProvider,
      PhoneMultiFactorGenerator,
      multiFactor
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPU-jsIupu3lsRrknmlv04A3YnBwXeePU",
      authDomain: "lixby0.firebaseapp.com",
      projectId: "lixby0",
      storageBucket: "lixby0.firebasestorage.app",
      messagingSenderId: "1058088945026",
      appId: "1:1058088945026:web:c56eaa9c71f1ca625fbb9b",
      measurementId: "G-689VDV93C2"
    };

    const statusMsg = document.getElementById("statusMsg");
    const phoneNumber = document.getElementById("phoneNumber");
    const currentPassword = document.getElementById("currentPassword");
    const smsCode = document.getElementById("smsCode");
    const sendCodeBtn = document.getElementById("sendCodeBtn");
    const verifyEnrollBtn = document.getElementById("verifyEnrollBtn");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let recaptchaVerifier = null;
    let verificationId = "";

    function showStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`.trim();
    }

    function initRecaptcha() {
      if (recaptchaVerifier) return;
      recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
        size: "normal"
      });
      recaptchaVerifier.render();
    }

    function getPhoneFactor(user) {
      const enrolled = multiFactor(user).enrolledFactors;
      return enrolled.find((factor) => factor.factorId === PhoneMultiFactorGenerator.FACTOR_ID) || null;
    }

    async function reauthUser(user) {
      const password = currentPassword.value.trim();
      if (!password) {
        showStatus("Wprowadź aktualne hasło, aby kontynuować.", "error");
        throw new Error("missing-password");
      }
      if (!user.email) {
        showStatus("Użytkownik nie ma adresu e-mail do ponownego uwierzytelnienia.", "error");
        throw new Error("missing-email");
      }
      const credential = EmailAuthProvider.credential(user.email, password);
      await reauthenticateWithCredential(user, credential);
    }

    function normalizePhone(value) {
      const raw = value.trim();
      if (!raw) return "";
      return raw.startsWith("+") ? raw : "";
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "/pl/login/";
        return;
      }
      initRecaptcha();
      if (!user.emailVerified) {
        showStatus("Zweryfikuj swój adres e-mail przed aktywacją 2FA.", "error");
        sendCodeBtn.disabled = true;
        verifyEnrollBtn.disabled = true;
      }
      const factor = getPhoneFactor(user);
      if (factor) {
        showStatus(`2FA aktywne z ${factor.phoneNumber || "telefonem"}.`, "success");
      } else {
        showStatus("2FA nie jest aktywowane na tym koncie.");
      }
    });

    function toggleVerifyButton() {
      const hasCode = smsCode.value.trim().length > 0;
      verifyEnrollBtn.style.display = hasCode ? "inline-flex" : "none";
    }

    toggleVerifyButton();
    smsCode.addEventListener("input", toggleVerifyButton);

    sendCodeBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) {
        showStatus("Sesja nieprawidłowa.", "error");
        return;
      }

      if (!user.emailVerified) {
        showStatus("Zweryfikuj swój adres e-mail przed aktywacją 2FA.", "error");
        return;
      }

      const phone = normalizePhone(phoneNumber.value);
      if (!phone) {
        showStatus("Wprowadź numer w formacie międzynarodowym (+48...).", "error");
        return;
      }

      try {
        sendCodeBtn.disabled = true;
        const originalText = sendCodeBtn.textContent;
        sendCodeBtn.textContent = "Wysyłanie...";
        showStatus("Wysyłanie kodu...", "info");
        await reauthUser(user);
        const multiFactorSession = await multiFactor(user).getSession();
        const phoneInfoOptions = {
          phoneNumber: phone,
          session: multiFactorSession
        };
        const phoneAuthProvider = new PhoneAuthProvider(auth);
        verificationId = await phoneAuthProvider.verifyPhoneNumber(phoneInfoOptions, recaptchaVerifier);
        showStatus("Kod wysłany przez SMS.", "success");
      } catch (error) {
        recaptchaVerifier?.clear();
        recaptchaVerifier = null;
        initRecaptcha();
        const message = error?.message || error?.code || String(error);
        console.error("SMS error:", error);
        showStatus(`Nie udało się wysłać SMS: ${message}`, "error");
      } finally {
        sendCodeBtn.disabled = false;
        sendCodeBtn.textContent = "Wyślij kod";
      }
    });

    verifyEnrollBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) {
        showStatus("Sesja nieprawidłowa.", "error");
        return;
      }

      if (!verificationId) {
        showStatus("Najpierw wyślij kod SMS.", "error");
        return;
      }

      const code = smsCode.value.trim();
      if (!code) {
        showStatus("Wprowadź kod SMS.", "error");
        return;
      }

      try {
        verifyEnrollBtn.disabled = true;
        const originalText = verifyEnrollBtn.textContent;
        verifyEnrollBtn.textContent = "Weryfikowanie...";
        showStatus("Weryfikowanie kodu...", "info");
        const cred = PhoneAuthProvider.credential(verificationId, code);
        const assertion = PhoneMultiFactorGenerator.assertion(cred);
        await multiFactor(user).enroll(assertion, "Telefon");
        showStatus("Weryfikacja dwuetapowa aktywowana.", "success");
        verificationId = "";
        smsCode.value = "";
        toggleVerifyButton();
        setTimeout(() => {
          window.location.href = "/pl/account/";
        }, 900);
      } catch (error) {
        const message = error?.message || error?.code || String(error);
        console.error("2FA enroll error:", error);
        showStatus(`Nie udało się aktywować 2FA: ${message}`, "error");
      } finally {
        verifyEnrollBtn.disabled = false;
        verifyEnrollBtn.textContent = "Zweryfikuj i aktywuj";
      }
    });

    // Przycisk dezaktywacji usunięty na żądanie.
  </script>
