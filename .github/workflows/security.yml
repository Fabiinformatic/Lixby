# Seguridad: secretos (Gitleaks), SAST (Semgrep CE) y dependencias.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.180.0"

jobs:
  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks (con comprobacion de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gl.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gl.sum "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" gl.sum | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear (respeta .gitleaksignore y .gitleaks.toml)
        run: ./gitleaks detect --source . --redact --no-banner --verbose

  sast:
    name: Codigo (Semgrep CE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: Escanear (sin telemetria; solo falla con severidad ERROR)
        run: |
          semgrep scan \
            --metrics=off \
            --config p/javascript --config p/nodejs --config p/owasp-top-ten \
            --severity ERROR --error .

  deps:
    name: Dependencias (pnpm y npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm from package.json
        run: corepack enable
      - name: Auditar dependencias de produccion (raiz)
        run: pnpm audit --prod --audit-level=high
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Auditar dependencias de produccion (Cloud Functions)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high
